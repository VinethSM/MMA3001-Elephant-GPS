decision: D8
recorded_utc: '2026-09-19T11:05:52.503169+00:00'
recommendation_scope: conditional_policy
selected_method: pchip
selected_interval_minutes: 30
reason: >-
  PCHIP at 30-minute intervals met both project criteria for all six
  elephants, with a median position error of 39.632 m and a median
  absolute path-length error of 7.907%. Results were similar for both
  starting offsets, but some individual segments exceeded the
  tolerances. The recommendation therefore applies to broad-scale
  movement monitoring under the chosen project tolerances.

evidence_that_would_require_shorter_interval: >-
  I would retain the original 15-minute interval or separately
  validate a shorter interval if fine-scale movements, sharp turns,
  road crossings or proximity to hazards needed to be identified.
  I would also reconsider the recommendation if new data failed
  either project accuracy criterion.