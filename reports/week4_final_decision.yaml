reason:   I selected 30-minute sampling because it was the longest tested
  interval satisfying both accuracy criteria for all six elephants.
  At this interval, PCHIP had the lowest median position error and
  zero coordinate overshoot. Cubic had a lower median absolute
  path-length error, but it produced coordinate overshoot, so PCHIP
  provided the preferred overall balance.
evidence_that_would_change_decision:   I would reconsider this choice if new data failed either accuracy
  criterion or the application required fine-scale or safety-critical
  movement information. Passing the median criteria does not mean
  every individual movement is reconstructed accurately.